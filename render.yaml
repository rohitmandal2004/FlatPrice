services:
  - type: web
    name: flat-price-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: FRONTEND_URL
        value: "https://flat-price-psi.vercel.app" # UPDATE THIS AFTER DEPLOYING FRONTEND
